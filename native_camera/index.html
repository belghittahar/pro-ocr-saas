<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .btn {
      border: 1px solid #4F8BFF;
      color: #FAFAFA;
      background-color: #4F8BFF;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #3B72E5;
      border-color: #3B72E5;
    }
    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="upload-btn-wrapper">
      <div class="btn">📸 Capture with Device Camera</div>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" />
    </div>
  </div>
  
  <script>
    // Streamlit Component Messaging API
    function sendMessageToStreamlitClient(type, data) {
      var outData = Object.assign({
          isStreamlitMessage: true,
          type: type,
      }, data);
      window.parent.postMessage(outData, "*");
    }

    function init() {
      sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
    }

    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
    }

    window.onload = function() {
      init();
      setFrameHeight(50);
    }

    document.getElementById("cameraInput").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result;
          sendMessageToStreamlitClient("streamlit:setComponentValue", {value: base64Data});
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
